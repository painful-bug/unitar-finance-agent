[project]
name = "finance-agent-beta"
version = "0.1.0"
description = "Framework-free personal finance agent with MCP and Jev context management"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "groq>=0.31,<1",
  "mcp>=2,<3",
  "pydantic>=2.11,<3",
  "typesafe-sdk>=0.1,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9"]
eval = ["openai==2.54.0", "instructor==1.16.0"]

[project.scripts]
finance-mcp = "finance_agent.server:main"
finance-eval = "finance_agent.evaluation:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finance_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
